services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: ${SMOKE_DB_PASSWORD}
      POSTGRES_DB: smoke
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U smoke -d smoke']
      interval: 2s
      timeout: 3s
      retries: 40
    mem_limit: 384m
  redis:
    image: ${REDIS_IMAGE}
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 40
    mem_limit: 128m
  app:
    image: ${SMOKE_APP_IMAGE}
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      AUTO_SETUP: 'true'
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USER: smoke
      DATABASE_PASSWORD: ${SMOKE_DB_PASSWORD}
      DATABASE_DBNAME: smoke
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ADMIN_EMAIL: smoke@example.invalid
      ADMIN_PASSWORD: ${SMOKE_ADMIN_PASSWORD}
      JWT_SECRET: ${SMOKE_JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${SMOKE_TOTP_KEY}
      TZ: Asia/Tokyo
      DATABASE_MAX_OPEN_CONNS: '10'
      DATABASE_MAX_IDLE_CONNS: '2'
      REDIS_POOL_SIZE: '20'
      REDIS_MIN_IDLE_CONNS: '2'
      LOG_LEVEL: warn
    tmpfs:
      - /app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1200m
  proxy:
    image: ${NGINX_IMAGE}
    ports:
      - '127.0.0.1::80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    mem_limit: 96m
